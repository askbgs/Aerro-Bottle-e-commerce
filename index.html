<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        const originalFetch = window.fetch;
        if (originalFetch) {
          let currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get() {
                return currentFetch;
              },
              set(value) {
                currentFetch = value;
              },
              configurable: true,
              enumerable: true
            });
            
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', {
                get() {
                  return currentFetch;
                },
                set(value) {
                  currentFetch = value;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {
            console.warn("Failed to patch fetch property descriptors:", e);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
